<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain on Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<style>
[hidden] { display: none !important; }
:root {
  /* Full-bleed WebGL window pane; one frosted control tray floats in the corner like a sticker on the glass */
  --night: #07090d;
  --ink: #e6ebf3;
  --dim: #8d97aa;
  --tray: rgba(12, 15, 22, 0.58);
  --line: rgba(220, 232, 255, 0.14);
  --accent: #a9ccff;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); overflow: hidden; font-family: var(--mono); }
#glass { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }

.tray {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(290px, calc(100vw - 32px));
  background: var(--tray); border: 1px solid var(--line); border-radius: 10px;
  -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
  font-size: 12px; line-height: 1.4;
}
.tray summary {
  list-style: none; cursor: pointer; padding: 10px 12px;
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
}
.tray summary::-webkit-details-marker { display: none; }
.tray summary::before { content: "+"; color: var(--dim); width: 10px; }
.tray[open] summary::before { content: "−"; }
.stat { margin-left: auto; color: var(--dim); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
.rows { padding: 2px 12px 12px; display: grid; gap: 10px; }
.row { display: grid; gap: 3px; }
.row label { display: flex; justify-content: space-between; color: var(--dim); }
.row output { color: var(--ink); font-variant-numeric: tabular-nums; }
select { font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
select option { background: var(--night); }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btns button, .btns .file {
  font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
.btns button:hover, .btns .file:hover { background: rgba(255, 255, 255, 0.13); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.note { margin: 0; color: var(--dim); }
#nogl[hidden] { display: none; }
#nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<canvas id="glass" aria-label="Rain running down a window at night"></canvas>
<div id="nogl" hidden>This effect needs WebGL 2. Try a current version of Chrome, Safari, Firefox or Edge.</div>

<details class="tray" id="tray" open>
  <summary>Window <span class="stat" id="stat">0 drops</span></summary>
  <div class="rows">
    <div class="row"><label for="rain">Rainfall <output id="rainOut"></output></label><input type="range" id="rain" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="size">Drop size <output id="sizeOut"></output></label><input type="range" id="size" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="mist">Condensation <output id="mistOut"></output></label><input type="range" id="mist" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="refract">Refraction <output id="refractOut"></output></label><input type="range" id="refract" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="fog">Fog <output id="fogOut"></output></label><input type="range" id="fog" min="0" max="1" step="0.01"></div>
    <div class="row"><label for="scene">View outside</label>
      <select id="scene"><option value="dusk">Dusk street</option><option value="night">Night city</option></select></div>
    <div class="btns">
      <button id="wipe" type="button">Wipe glass</button>
      <button id="pause" type="button">Pause</button>
      <button id="sound" type="button" aria-pressed="true">Mute sound</button>
      <label class="file" for="photo">Use a photo or video</label>
      <input class="sr" type="file" id="photo" accept="image/*,video/*">
    </div>
    <p class="note">Drag across the glass to wipe it as if with three fingers. Above 70% rainfall, streams start running down the pane. Drop a photo or video anywhere to look through it.</p>
  </div>
</details>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const canvas = $('glass');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl) { $('nogl').hidden = false; $('tray').hidden = true; return; }
let hasFloat = !!gl.getExtension('EXT_color_buffer_float');

// ---------- settings ----------
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Each slider's midpoint is the tuned look; either half of the track scales from there to 0 or 1.
const MID = { rain: 0.7, size: 0.07, mist: 0.83, refract: 0.7, fog: 0.87 };
const fromSlider = (k, v) => (v <= 0.5 ? MID[k] * v * 2 : MID[k] + (1 - MID[k]) * (v - 0.5) * 2);
const P = {}, SL = {};   // P: values the simulation uses; SL: slider positions as shown (0–1)
for (const k of Object.keys(MID)) {
  const el = $(k), out = $(k + 'Out');
  el.value = k === 'rain' && reduced ? 0.3 : 0.5;
  const upd = () => { SL[k] = +el.value; P[k] = fromSlider(k, SL[k]); out.textContent = Math.round(+el.value * 100) + '%'; };
  el.addEventListener('input', upd); upd();
}
if (innerWidth < 640) $('tray').open = false;

// ---------- GL helpers ----------
function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs, names) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; for (const n of names) u[n] = gl.getUniformLocation(p, n);
  return { p, u };
}

// Each blob is an instanced quad holding an uneven capsule: a bottom circle (r1) and a top
// circle (r2) joined by tangents, rotated by an angle. A round drop is the case r1 = r2, len = 0.
// The fragment writes a metaball field (R) for the outline and a height (G) for the lens.
// Overlapping fields fuse, so touching water reads as one body.
const BLOB_VS = `#version 300 es
layout(location=0) in vec2 aQuad;
layout(location=1) in vec4 aA;   // x, y, r1, r2 (px)
layout(location=2) in vec4 aB;   // len, angle, p0, p1
uniform vec2 uView;
uniform float uMargin;
out vec2 vL;
out vec2 vW;
out vec4 vA;
out vec4 vB;
void main() {
  float R = max(aA.z, aA.w) * (1.0 + uMargin + aB.z) + 1.5;
  float lx = aQuad.x * R;
  float ly = mix(-R, aB.x + R, aQuad.y * 0.5 + 0.5);
  float c = cos(aB.y), s = sin(aB.y);
  vec2 px = aA.xy + vec2(c * lx + s * ly, s * lx - c * ly);
  gl_Position = vec4(px.x / uView.x * 2.0 - 1.0, 1.0 - px.y / uView.y * 2.0, 0.0, 1.0);
  vL = vec2(lx, ly); vW = px; vA = aA; vB = aB;
}`;
const BLOB_FS = `#version 300 es
precision highp float;
in vec2 vL;
in vec2 vW;
in vec4 vA;
in vec4 vB;
uniform int uMode;
out vec4 o;
float sdCap(vec2 p, float r1, float r2, float h) {
  p.x = abs(p.x);
  if (h < abs(r1 - r2) + 0.01) return length(p) - max(r1, r2);
  float b = (r1 - r2) / h, a = sqrt(1.0 - b * b);
  float k = dot(p, vec2(-b, a));
  if (k < 0.0) return length(p) - r1;
  if (k > a * h) return length(p - vec2(0.0, h)) - r2;
  return dot(p, vec2(a, b)) - r1;
}
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
void main() {
  float r1 = vA.z, r2 = vA.w, h = vB.x;
  float s = sdCap(vL, r1, r2, h);
  if (uMode == 0) {
    // p0 = how uneven the edge is, p1 = seed: the outline wobbles with angle around the body
    float th = atan(vL.y - h * 0.4, vL.x);
    float sd = vB.w;
    s -= (0.5 * sin(2.0 * th + sd) + 0.3 * sin(3.0 * th + sd * 1.7) + 0.2 * sin(5.0 * th + sd * 2.9)) * vB.z * r1;
    float d = max(0.0, 1.0 + s / r1);
    float f = d < 1.3 ? pow(1.0 - d * d / 1.69, 3.0) : 0.0;
    o = vec4(f, max(0.0, 1.0 - d * d) * r1 / 32.0, 0.0, 0.0);
  } else if (uMode == 5) {
    // Tail of a running drop: the water thins toward the wet track it leaves, so there is no edge
    // to see. Its field and height fade away along its length, and B marks it as thin film.
    float d = max(0.0, 1.0 + s / r1);
    float f = d < 1.3 ? pow(1.0 - d * d / 1.69, 3.0) : 0.0;
    float along = clamp(vL.y / (h + r2), 0.0, 1.0), fade = (1.0 - along) * (1.0 - along);
    float above = smoothstep(-0.3 * r1, 0.4 * r1, vL.y);
    if (vB.w > 0.5) {   // a piece of wet trail: even, at the given strength, and only its own slab so pieces join seamlessly
      fade = vB.z; above = (vL.y >= 0.0 && vL.y < h) ? 1.0 : 0.0;
    }
    o = vec4(f * fade * above, max(0.0, 1.0 - d * d) * r1 * 0.35 * fade * above / 32.0, 0.45 * above * (1.0 - smoothstep(0.9, 1.3, d)), 0.0);
  } else if (uMode == 3) {
    // stream: a rounded bead of water sitting flat on the glass, so the crown is broad and gentle.
    // Height keeps one smooth cross-section (blended with MAX). The outline field goes to alpha and
    // adds up, so wherever water meets water the join rounds off the way a liquid does. Each
    // segment only adds its own slab (plus end caps, p1 bits), so a stream doesn't swell itself.
    float d = max(0.0, 1.0 + s / r1);
    float f = d < 1.3 ? pow(1.0 - d * d / 1.69, 3.0) : 0.0;
    int caps = int(vB.w + 0.5);
    if ((vL.y < 0.0 && (caps & 1) == 0) || (vL.y >= h && (caps & 2) == 0)) f = 0.0;
    float e = min(d, 1.0);
    o = vec4(0.0, (1.0 - e * e * e * e) * r1 * 0.8 / 32.0, d < 1.0 ? 1.0 : 0.0, f);
  } else if (uMode == 1) {
    o = vec4(0.0, 0.0, 0.0, 1.0 - smoothstep(0.55, 1.0, 1.0 + s / r1));
  } else {
    // finger contact: p0 = pressure, p1 = smudge. A smudging finger leaves an even, softly mottled film.
    // p1 = 0 for the pads; 1 + smudge for the lower segments, whose pressure fades toward the palm
    float d = 1.0 + s / max(r1, r2);
    float lower = step(0.5, vB.w);
    float sm = lower * (vB.w - 1.0);
    float a = 1.0 - smoothstep(mix(0.86, 0.45, sm), 1.0, d);
    float blot = vnoise(vW * 0.025);
    a *= vB.z * mix(1.0, 0.55 + 0.9 * blot, sm);
    a *= mix(1.0, smoothstep(0.0, 0.6 * h, vL.y), lower);
    o = vec4(0.0, 0.0, 0.0, clamp(a, 0.0, 1.0));
  }
}`;
const blob_names = ['uView', 'uMargin', 'uMode'];
const QUAD_VS = `#version 300 es
layout(location=0) in vec2 aQuad;
out vec2 vUv;
void main() { vUv = aQuad * 0.5 + 0.5; gl_Position = vec4(aQuad, 0.0, 1.0); }`;
const COPY_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uTex;
out vec4 o;
void main() { o = vec4(texture(uTex, vUv).rg, 0.0, 0.0); }`;
const FILL_FS = `#version 300 es
precision highp float;
uniform vec4 uColor;
out vec4 o;
void main() { o = uColor; }`;
const FINAL_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform sampler2D uWater;
uniform sampler2D uMist;
uniform sampler2D uBg;
uniform vec2 uTexel;
uniform vec2 uBgScale;
uniform vec2 uBgSize;
uniform float uAspect;
uniform float uRefract;
uniform float uFog;
uniform float uLod;
const float T = 0.068;

vec2 bgUv(vec2 uv) { return (uv - 0.5) * uBgScale + 0.5; }
vec3 bgAt(vec2 uv, float lod) { return textureLod(uBg, bgUv(uv), lod).rgb; }
vec3 bgBlur(vec2 uv, float lod) {
  vec2 b = bgUv(uv);
  vec2 r = exp2(lod) / uBgSize * 1.1;
  vec3 c = textureLod(uBg, b, lod).rgb * 0.2;
  for (int i = 0; i < 8; i++) {
    float a = float(i) * 0.7853982 + 0.39;
    c += textureLod(uBg, b + vec2(cos(a), sin(a)) * r, lod).rgb * 0.1;
  }
  return c;
}
void main() {
  vec2 uv = vUv;
  vec4 w = texture(uWater, uv);
  float field = w.r + w.a;   // drops and mist in R, streams in A
  float fw = max(fwidth(field), 1e-4);
  float stream = step(0.7, w.b);                              // streams write 1 into B
  float film = clamp(w.b / 0.45, 0.0, 1.0) * (1.0 - stream);  // a running drop's tail: thin water, no edge
  float soft = mix(fw, T * 0.9, film);
  float mask = smoothstep(T - soft, T + soft, field);

  float hL = texture(uWater, uv - vec2(uTexel.x * 2.0, 0.0)).g;
  float hR = texture(uWater, uv + vec2(uTexel.x * 2.0, 0.0)).g;
  float hD = texture(uWater, uv - vec2(0.0, uTexel.y * 2.0)).g;
  float hU = texture(uWater, uv + vec2(0.0, uTexel.y * 2.0)).g;
  vec2 grad = vec2(hR - hL, hU - hD) * 8.0;
  vec3 n = normalize(vec3(-grad * 0.65, 1.0));

  // Glass: fogged where nothing has run through it yet, clear in the trails.
  float fog = clamp(texture(uMist, uv).b, 0.0, 1.0) * uFog;
  vec3 sharp = bgAt(uv, 0.8);
  vec3 hazy = bgBlur(uv, uLod);
  float lum = dot(hazy, vec3(0.299, 0.587, 0.114));
  hazy = mix(hazy, vec3(lum), 0.25) * 0.8 + vec3(0.085, 0.09, 0.1);
  vec3 glass = mix(sharp, hazy, fog);

  // Drop: a tiny lens. Displacement grows toward the rim, so the view inside is flipped.
  vec2 rUv = uv - n.xy * uRefract * vec2(uAspect, 1.0);
  vec3 inside = mix(bgAt(rUv, 0.35) * 1.15, hazy * 1.12, 0.3) + 0.03;   // clear water: lighter than the fogged glass
  float slope = length(n.xy);
  float rim = smoothstep(0.45, 0.77, slope);
  inside *= 1.0 - rim * mix(0.45, 0.3, stream) * (1.0 - 0.85 * film);
  float outline = (1.0 - smoothstep(T, T * 1.9, field)) * (1.0 - film);   // thin dark line where the surface turns away
  inside = mix(inside, inside * 0.28, outline * 0.8);
  inside += hazy * smoothstep(0.25, 0.7, slope) * max(-n.y, 0.0) * 0.9 * (1.0 - film);
  vec3 L = normalize(vec3(-0.4, 0.75, 0.9));
  float spec = pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 90.0);
  inside += spec * 0.75 * (1.0 - stream) * (1.0 - film);
  // streams catch the light across their flat crown: a soft, uneven sheen over roughly the middle half
  float crown = (1.0 - smoothstep(0.06, 0.5, slope)) * stream;
  float vary = 0.7 + 0.3 * sin(uv.y * 37.0 + uv.x * 11.0) * sin(uv.y * 13.0 - uv.x * 7.0);
  inside += (vec3(0.08) + hazy * 0.1) * crown * vary;

  vec3 col = mix(glass, inside, mask);
  float v = length((uv - 0.5) * vec2(1.0, 0.9));
  col *= mix(1.0, 0.72, smoothstep(0.4, 0.9, v));
  o = vec4(col, 1.0);
}`;

const blob = program(BLOB_VS, BLOB_FS, blob_names);
const copy = program(QUAD_VS, COPY_FS, ['uTex']);
const fill = program(QUAD_VS, FILL_FS, ['uColor']);
const fin = program(QUAD_VS, FINAL_FS, ['uWater', 'uMist', 'uBg', 'uTexel', 'uBgScale', 'uBgSize', 'uAspect', 'uRefract', 'uFog', 'uLod']);

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const instBuf = gl.createBuffer();

const vaoQuad = gl.createVertexArray();
gl.bindVertexArray(vaoQuad);
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const vaoInst = gl.createVertexArray();
gl.bindVertexArray(vaoInst);
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
gl.bufferData(gl.ARRAY_BUFFER, 32, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0); gl.vertexAttribDivisor(1, 1);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(2, 1);
gl.bindVertexArray(null);

function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (hasFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if (hasFloat && gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
    gl.deleteFramebuffer(fb); gl.deleteTexture(tex); hasFloat = false;
    return makeTarget(w, h);
  }
  return { tex, fb, w, h };
}
function freeTarget(t) { gl.deleteFramebuffer(t.fb); gl.deleteTexture(t.tex); }
function clearTarget(t, c) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb); gl.viewport(0, 0, t.w, t.h);
  gl.clearColor(c[0], c[1], c[2], c[3]); gl.clear(gl.COLOR_BUFFER_BIT);
}

class Batch {
  constructor() { this.a = new Float32Array(4096 * 8); this.n = 0; }
  push(x, y, r1, r2, len, ang, p0, p1) {
    if ((this.n + 1) * 8 > this.a.length) { const b = new Float32Array(this.a.length * 2); b.set(this.a); this.a = b; }
    const i = this.n++ * 8, a = this.a;
    a[i] = x; a[i + 1] = y; a[i + 2] = r1; a[i + 3] = r2; a[i + 4] = len; a[i + 5] = ang; a[i + 6] = p0; a[i + 7] = p1;
  }
}
const droplets = new Batch(), erase = new Batch(), wipes = new Batch(), beads = new Batch(), dropQuads = new Batch(), streams = new Batch(), tails = new Batch();

function drawBlobs(b, mode, margin) {
  if (!b.n) return;
  gl.useProgram(blob.p);
  gl.uniform2f(blob.u.uView, simW, simH);
  gl.uniform1f(blob.u.uMargin, margin);
  gl.uniform1i(blob.u.uMode, mode);
  gl.bindVertexArray(vaoInst);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferData(gl.ARRAY_BUFFER, b.a.subarray(0, b.n * 8), gl.DYNAMIC_DRAW);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, b.n);
}
function drawFill(r, g, b, a) {
  gl.useProgram(fill.p);
  gl.uniform4f(fill.u.uColor, r, g, b, a);
  gl.bindVertexArray(vaoQuad);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- background: a night street seen through the window ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function paintCity() {
  const w = 2048, h = 1280;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  const R = mulberry32(11), rnd = (a, b) => a + (b - a) * R();
  const rgba = (col, a) => `rgba(${col[0]},${col[1]},${col[2]},${a})`;
  const glow = (gx, gy, r, col, a) => {

        // running until its own water is spent unless more arrives to feed it.

}

// ---------- streams: in heavy rain, water finds channels and keeps running ----------
const rivulets = [];
let clock = 0;
// How much a passing surge of water swells the channel, and how long a stretch it covers.
const SURGE_AMP = [0.14, 0.28], SURGE_LEN = [0.05, 0.1];

function newRivulet(x0, y0, o = {}) {
  return {
    pts: [], y0, x: x0, vx: 0, phase: rand() * 100,
    ph: o.ph || [rand() * 6.283, rand() * 6.283, rand() * 6.283],
    stopAt: o.stopAt ?? Infinity, speed: (2.5 + rand() * 4) * S, w: o.w ?? (3 + rand() * 3) * S, flow: o.flow ?? 1,
    surges: [], front: -1, carving: false, stalled: false, burst: 0, joined: null, joins: [], pool: null, spill: null, orphan: !!o.orphan,
  };
}
function spawnRivulet() {
  const stopAt = rand() < 0.12 ? simH * (0.35 + rand() * 0.5) : Infinity;   // now and then the water runs out
  rivulets.push(newRivulet(rand() * simW, -6, { stopAt }));

const streamWidth = (rv) => rv.w * (0.35 + 0.65 * Math.min(1, rv.flow));
// Channel width along its length: smooth, irregular, fixed once the water has carved it.
function channelWidth(rv, y) {

    y, len: simH * (SURGE_LEN[0] + rand() * (SURGE_LEN[1] - SURGE_LEN[0])),
    amp: SURGE_AMP[0] + rand() * (SURGE_AMP[1] - SURGE_AMP[0]) + extra, speed: (12 + rand() * 16) * S,

// A surge swells a stretch of the channel smoothly, peaking in its middle.

  for (const f of hand.fingers) {
    let lx = f.x, ly = f.tip + TIP * L;
    wipes.push(x + c * lx - s * ly, y + s * lx + c * ly, rMid, rTip, TIP * L, ang, 1, 0);
    ly = f.tip + L;
    wipes.push(x + c * lx - s * ly, y + s * lx + c * ly, rBase, rMid, (1 - TIP) * L, ang, lowP, 1 + sm);
  }
  for (const k of hand.circles) markWiped(x + c * k.x - s * k.y, y + s * k.x + c * k.y, k.r, k.lower ? lowP : 1);
}

function sweep(a, b, a0, a1) {
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  const pl = Math.hypot(stroke.mx, stroke.my), pmx = pl > 0.2 ? stroke.mx / pl : 0, pmy = pl > 0.2 ? stroke.my / pl : 0;
  if (len > 0.5) {
    const k = Math.min(1, len / 40);
    stroke.mx += (dx / len - stroke.mx) * k; stroke.my += (dy / len - stroke.my) * k;
  }
  const { minR, maxR } = radii();
  const ml = Math.hypot(stroke.mx, stroke.my) || 1, mx = stroke.mx / ml, my = stroke.my / ml, nx = -my, ny = mx;
  const steps = Math.max(1, Math.ceil(Math.max(len, Math.abs(a1 - a0) * hand.L) / (hand.w * 0.25))), stepLen = len / steps;
  const reach = hand.L + hand.w * 2;

  for (let st = 1; st <= steps; st++) {
    const t = st / steps, x = a.x + dx * t, y = a.y + dy * t, ang = a0 + (a1 - a0) * t;
    const c = Math.cos(ang), s = Math.sin(ang);
    stroke.dist += stepLen;
    stroke.lowTimer -= stepLen;
    if (stroke.lowTimer <= 0) {
      stroke.lowT = rand() < 0.25 ? 0.45 + rand() * 0.25 : 0.06 + rand() * 0.1;
      stroke.lowTimer = hand.w * (2 + rand() * 4);
    }
    if (stepLen > 0) stroke.lowP += (stroke.lowT - stroke.lowP) * 0.08;
    stampHand(x, y, ang, len <= 0.5);
    const w0 = stroke.water;

    // drops under the pads are swept into the strip; the lower fingers only take part of them
    for (const d of drops) {
      if (d.dead) continue;
      const wx = d.x - x, wy = d.y - y;
      if (Math.abs(wx) > reach || Math.abs(wy) > reach) continue;
      const qx = c * wx + s * wy, qy = -s * wx + c * wy;
      for (const cc of hand.circles) {
        const ex = qx - cc.x, ey = qy - cc.y, rr = cc.r + d.r * 0.3;
        if (ex * ex + ey * ey >= rr * rr) continue;
        if (!cc.lower) { stroke.water += d.r ** 3; d.dead = true; }
        else {
          const v = d.r ** 3 * (0.2 + 0.7 * stroke.lowP);
          stroke.water += v; d.r = Math.cbrt(d.r ** 3 - v);
          if (d.r < minR) { stroke.water += d.r ** 3; d.dead = true; }
        }
        break;
      }
    }
    // streams under the fingers are wiped too; the water above keeps its track
    for (const rv of rivulets) {
      for (const q of rv.pts) {
        if (!q.on) continue;
        const wx = q.x - x, wy = q.y - y;
        if (Math.abs(wx) > reach || Math.abs(wy) > reach) continue;
        const qx = c * wx + s * wy, qy = -s * wx + c * wy;
        for (const cc of hand.circles) {
          const ex = qx - cc.x, ey = qy - cc.y;
          if (ex * ex + ey * ey < cc.r * cc.r) {
            q.on = false; stroke.water += (rv.w * q.k) ** 2 * 1.8;
            rv.cutDir = Math.hypot(stroke.mx, stroke.my) > 0.2 ? { x: mx, y: my } : null;
            break;
          }
        }
      }
    }
    if (len <= 0.5) { stroke.water = Math.min(stroke.water, maxR ** 3); continue; }

    let ePos = -Infinity, eNeg = Infinity;
    for (const cc of hand.circles) {
      const q = (c * cc.x - s * cc.y) * nx + (s * cc.x + c * cc.y) * ny;
      ePos = Math.max(ePos, q + cc.r); eNeg = Math.min(eNeg, q - cc.r);
    }
    // so is the film of mist and fog
    stroke.water += stepLen * (ePos - eNeg) * (0.15 + 0.6 * P.mist) * S;
    // there is only so much the fingers can push; beyond that it smears off the sides as film
    if (stroke.water > pushLimit() * 1.05) {
      stroke.water = pushLimit() * 1.05;
      for (const [side, sg] of [[ePos, 1], [eNeg, -1]]) {
        if (rand() > 0.3) continue;
        const rr = (0.8 + rand() * 1.6) * S, o = side + sg * rr * (0.5 + rand()), back = -rand() * hand.w * 0.5;
        smallDrop(x + nx * o + mx * back, y + ny * o + my * back, rr);
      }
    }
    // The pushed water sits on the glass against the fingers, sagging toward the strip's lower
    // end. Once there is more than surface tension can hold in place, a large drop breaks off that
    // low end and runs down (now and then opening a stream), leaving the rest of the strip behind.
    if (stroke.water > pushLimit()) {
      let low = null;
      for (const p of puddle()) if (!low || p.y > low.y) low = p;
      if (low) {
        const r0 = holdR() * 2.2, bx = low.x, by = low.y + low.t * 0.5 + r0 * 0.5;
        if (rand() < 0.25 && rivulets.length < 30) {
          const rv = newRivulet(bx, by, { w: Math.min(6 * S, r0 * 0.4), flow: 1, stopAt: by + simH * (0.25 + rand() * 0.5) });
          rv.burst = 1;
          rivulets.push(rv);
        } else {
          const dd = addDrop(bx, by, r0, { stick: 1 });
          if (dd) { dd.moving = true; dd.vy = Math.max(dd.vy, 1.5 * S); dd.trailY = dd.y; dd.gap = dd.r * 2; }
        }
        stroke.water *= 0.1;
      }
    }
  }

  // Changing direction mid-wipe leaves a small, thin puddle lying along the wipe line, mostly on
  // the outside of the turn where the fingers' edge sweeps fastest.
  if (len > 0.5 && pl > 0.2) {
    const ux = dx / len, uy = dy / len;
    const turn = Math.acos(Math.max(-1, Math.min(1, pmx * ux + pmy * uy)));
    let n = Math.min(2, Math.floor(turn * 6 + rand()));
    if (n > 0) {
      const c = Math.cos(a1), s = Math.sin(a1);
      let ePos = -Infinity, eNeg = Infinity;
      for (const cc of hand.circles) {
        const q = (c * cc.x - s * cc.y) * nx + (s * cc.x + c * cc.y) * ny;
        ePos = Math.max(ePos, q + cc.r); eNeg = Math.min(eNeg, q - cc.r);
      }
      const outer = pmx * uy - pmy * ux > 0 ? -1 : 1;
      while (n-- > 0) {
        const sg = rand() < 0.75 ? outer : -outer, th = (0.9 + rand() * 0.9) * S;
        const L = (8 + rand() * 22) * S * Math.min(1.5, 0.6 + turn), o = (sg > 0 ? ePos : eNeg) + sg * th * 0.7, t = rand();
        const cx = a.x + dx * t + nx * o, cy = a.y + dy * t + ny * o;
        // one uneven, slightly wobbly sliver along the edge, a little fuller at one end
        const f = rand() < 0.5 ? 1 : -1, sx = cx - ux * L * 0.5 * f, sy = cy - uy * L * 0.5 * f;
        beads.push(sx, sy, th * (0.7 + rand() * 0.3), th * (1 + rand() * 0.4), L, Math.atan2(ux * f, -uy * f), 0.12, rand() * 6.283);
      }
    }
  }
}

// Lifting the fingers leaves the strip behind. It breaks where it is thickest into mid to large
// drops whose combined volume is at most one large natural drop; the heaviest may start to run.
function release() {
  if (!stroke) return;
  const { minR, maxR } = radii(), rSlide = holdR();
  const band = stroke.water > 0 ? puddle() : [];
  const vol = band.map((p, i) => (i ? p.t * p.t * Math.hypot(p.x - band[i - 1].x, p.y - band[i - 1].y) : 0));
  const total = vol.reduce((x, y) => x + y, 0);
  if (total > 0) {
    const k = Math.min(stroke.water, maxR ** 3) / total, target = () => (maxR * (0.3 + rand() * 0.6)) ** 3;
    let acc = 0, ax = 0, ay = 0, want = target();
    for (let i = 0; i < band.length; i++) {
      const v = vol[i] * k;
      acc += v; ax += band[i].x * v; ay += band[i].y * v;
      if (acc < want && i < band.length - 1) continue;
      if (acc > (minR * 1.2) ** 3) {
        const d = addDrop(ax / acc + (rand() - 0.5) * 3, ay / acc + (rand() - 0.5) * 3, Math.min(maxR, Math.cbrt(acc)), { spread: 0.3, stick: 0.6 });
        if (d && !d.moving && d.r > rSlide && rand() < 0.4) { d.moving = true; d.vy = 0.05; d.trailY = d.y; d.gap = d.r; }
      } else if (acc > 0) smallDrop(ax / acc, ay / acc, Math.max(0.8 * S, Math.cbrt(acc)));
      acc = ax = ay = 0; want = target();
    }
    // a thin film of fine beads stays where the strip lay
    for (let i = 0; i < band.length; i += 2) {
      if (rand() < 0.3) smallDrop(band[i].x + (rand() - 0.5) * band[i].t, band[i].y + (rand() - 0.5) * band[i].t, (0.8 + rand() * 1.2) * S);
    }
  }
  stroke = null;
}

canvas.addEventListener('pointerdown', (e) => {
  lastPt = pt(e); aimHand(lastPt, 0, true); sway = 0;
  stroke = { mx: 0, my: 0, water: 0, dist: 0, lowP: 0.1, lowT: 0.1, lowTimer: 0, ph: [rand() * 6.283, rand() * 6.283, rand() * 6.283] };
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  sweep(lastPt, lastPt, handA, handA);
});
canvas.addEventListener('pointermove', (e) => {
  if (!stroke) return;
  const p = pt(e), a0 = handA;
  aimHand(p, p.x - lastPt.x, false);
  sweep(lastPt, p, a0, handA);
  lastPt = p;
});
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

$('wipe').addEventListener('click', () => { for (const d of drops) d.dead = true; clearTarget(D, [0, 0, 0, 0]); wg.fill(0); });
let paused = false;
$('pause').addEventListener('click', () => { paused = !paused; $('pause').textContent = paused ? 'Resume' : 'Pause'; });

// ---------- render passes ----------
let fogAcc = 0;
function passMist(dt) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, D.fb); gl.viewport(0, 0, D.w, D.h);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE); drawBlobs(droplets, 0, 0.35);
  gl.blendFunc(gl.ZERO, gl.ONE_MINUS_SRC_ALPHA); drawBlobs(erase, 1, 0.05); drawBlobs(wipes, 2, 0.05);
  gl.blendFunc(gl.ONE, gl.ONE); drawBlobs(beads, 0, 0.35);   // trail beads land after the wipe
  fogAcc += dt;
  if (fogAcc >= 6) {
    const k = fogAcc; fogAcc = 0;
    gl.colorMask(false, false, true, false);           // glass slowly fogs back over
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    drawFill(0, 0, 1, 1 - Math.pow(1 - condenseRate(), k));
    gl.colorMask(true, true, false, false);            // mist evaporates
    gl.blendFunc(gl.ZERO, gl.SRC_ALPHA);
    drawFill(0, 0, 0, Math.pow(0.9993, k));
    gl.colorMask(true, true, true, true);
  }
  gl.disable(gl.BLEND);
  droplets.n = 0; erase.n = 0; wipes.n = 0; beads.n = 0;
}
function passWater() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, W.fb); gl.viewport(0, 0, W.w, W.h);
  gl.useProgram(copy.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, D.tex);
  gl.uniform1i(copy.u.uTex, 0);
  gl.bindVertexArray(vaoQuad); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  buildDropQuads();
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  drawBlobs(dropQuads, 0, 0.35);
  drawBlobs(tails, 5, 0.35);
  gl.blendEquationSeparate(gl.MAX, gl.FUNC_ADD);
  drawBlobs(streams, 3, 0.35);
  gl.blendEquation(gl.FUNC_ADD);
  gl.disable(gl.BLEND);
  dropQuads.n = 0; streams.n = 0; tails.n = 0;
}
function passFinal() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(fin.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, W.tex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, D.tex);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, bgTex);
  const u = fin.u;
  gl.uniform1i(u.uWater, 0); gl.uniform1i(u.uMist, 1); gl.uniform1i(u.uBg, 2);
  gl.uniform2f(u.uTexel, 1 / W.w, 1 / W.h);
  const A = simW / simH, B = bgW / bgH;
  if (A > B) gl.uniform2f(u.uBgScale, 1, B / A); else gl.uniform2f(u.uBgScale, A / B, 1);
  gl.uniform2f(u.uBgSize, bgW, bgH);
  gl.uniform1f(u.uAspect, simH / simW);
  gl.uniform1f(u.uRefract, 0.04 + P.refract * 0.26);
  gl.uniform1f(u.uFog, P.fog);
  gl.uniform1f(u.uLod, 4.5 + P.fog * 3.0);
  gl.bindVertexArray(vaoQuad); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- start with a pane that has already been in the rain ----------
// (deferred until the page has a real size; a frame can start out 0 x 0)
let warmed = false;
function prewarm() {
  if (warmed || innerWidth < 2 || innerHeight < 2) return;
  warmed = true;
  const { minR, maxR } = radii(), area = simW * simH / (1280 * 800);
  for (let i = 0; i < 160 * area; i++) addDrop(rand() * simW, rand() * simH, minR + (maxR * 0.8 - minR) * Math.pow(rand(), 2));
  for (let i = 0; i < 6000 * area * P.mist; i++) bead(droplets, rand() * simW, rand() * simH, (0.6 + rand() * rand() * 1.9) * S, 0.12);
  for (let i = 0; i < 300; i++) { step(1); passMist(1); }
}
resize();
prewarm();

let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 120); });

let last = performance.now(), statT = 0;
function frame(now) {
  const dt = Math.min(Math.max((now - last) / 16.667, 0.2), 3) * (reduced ? 0.6 : 1);
  last = now;
  if (innerWidth > 0 && innerHeight > 0 && (Math.round(innerWidth) !== simW || Math.round(innerHeight) !== simH)) resize();
  if (!warmed) prewarm();
  if (!paused) step(dt);
  stepSound(dt);
  passMist(paused ? 0 : dt);
  passWater();
  updateVideo();
  passFinal();
  if (now - statT > 400) {
    statT = now;
    let moving = 0; for (const d of drops) if (d.moving) moving++;
    $('stat').textContent = `${drops.length} drops · ${moving} running`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
